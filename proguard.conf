-dontnote

-dontobfuscate
-dontoptimize
-keepparameternames
-keepattributes *
-dontwarn java.lang.invoke.MethodHandle
# chicory targets Java 11, but libraryjars above is the Java 8 rt.jar, so any 9+ API it touches
# cannot be resolved. Written with the relocated name because proguard's input is the fat jar.
-dontwarn net.fabricmc.loader.impl.lib.chicory.**

-keep class !net.fabricmc.loader.impl.lib.** {
    *;
}

-keepclassmembers class * extends java.lang.Enum {
    <fields>;
    public static **[] values();
    public static ** valueOf(java.lang.String);
}